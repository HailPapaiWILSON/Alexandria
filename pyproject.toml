[project]
name = "alexandria"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
alex = "alexandria.main:app"

[build-system]
requires = ["hatchling"]
